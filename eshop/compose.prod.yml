name: smartwear

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/smartwear-backend:${IMAGE_TAG:-latest}
    env_file: .env
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    init: true
    networks: [internal]

  client:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/smartwear-client:${IMAGE_TAG:-latest}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000/api}
    ports: ["127.0.0.1:13001:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
    networks: [internal]

  admin:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/smartwear-admin:${IMAGE_TAG:-latest}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000/api}
    ports: ["127.0.0.1:13000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
    networks: [internal]

networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
